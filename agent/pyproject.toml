[tool.poetry]
name = "ai_researcher"
version = "0.1.0"
description = "AI Researcher Demo"
authors = ["Markus Ecker <markus.ecker@gmail.com>"]
license = "MIT"

[project]
name = "ai_researcher"
version = "0.0.1"
dependencies = [
  "langgraph",
  "langchain_core",
  "langchain_openai",
  "langchain",
  "openai",
  "langchain-community",
  "tavily-python",
  "copilotkit",
  "python-dotenv",
  "uvicorn",
]

[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[tool.poetry.dependencies]
python = ">=3.12,<3.15"
langgraph = "^1.2.0"
langchain-core = "^1.6.0"
langchain-openai = "^1.6.0"
langchain = "^1.4.0"
openai = "^3.0.0"
langchain-community = "^0.4.0"
tavily-python = "^0.5.0"
copilotkit = "^0.1.96"
python-dotenv = "^1.0.1"
uvicorn = "^0.31.0"
langchain-anthropic = "^1.7.0"


[tool.poetry.scripts]
demo = "ai_researcher.demo:main"
